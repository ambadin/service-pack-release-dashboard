# YAML generated by Copilot
name: service-pack-release-dashboard

services:
  app:
    container_name: service-pack-release-dashboard_app
    build:
      context: ..
      dockerfile: docker/Containerfile
    env_file: .env
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "${PORT:-8080}"
    # Bound to loopback only, matching the per-port platform architecture.
    # For local Podman Desktop testing on Windows this is still reachable at
    # http://localhost:${HOST_PORT}/ — change to 0.0.0.0 only if your Podman
    # machine networking requires it.
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:${PORT:-8080}"
    # Uncomment only if your environment intercepts TLS (see .env.example / Section 6
    # of the containerization guide). Leaving this active without the file on the
    # host causes Podman to create corporate-ca.crt as an empty directory.
    # volumes:
    #   - "${DB_DATA_PATH:-../data}/corporate-ca.crt:/usr/local/share/ca-certificates/corporate-ca.crt:ro"
    security_opt:
      - no-new-privileges
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
